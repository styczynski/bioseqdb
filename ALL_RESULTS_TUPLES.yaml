      ordinal: 0
    - human_label: Parallel dispatch
      key: parallel_dispatch
      ordinal: 1
    - human_label: Task parallel
      key: task_parallel
      ordinal: 2
    ordinal_one_spelling_note: The GUC enum spells ordinal 1 parallel_dispatch; the pipeline runtime enum spells it dispatch_parallel. This campaign selects task_parallel (ordinal 2) only.
    pipeline_cpp_type: bioseq::parallelism::pipeline_concurrency_mode
    pipeline_values:
    - human_label: Single thread
      key: single_thread
      ordinal: 0
    - human_label: Parallel dispatch
      key: dispatch_parallel
      ordinal: 1
    - human_label: Task parallel
      key: task_parallel
      ordinal: 2
  projection_description: Generated descriptive projection for interpreting approved_results. Literal keys record the aggregator-observed configuration values; labels are explanatory only, requested and observed identities are separate facts, and code enums remain authoritative.
metric_definitions:
  a:
    aggregation: P50 of per-repeat A values.
    per_repeat_definition: 'The exact interval classified by the row timing_scope: frozen outer E2E for historical_outer_e2e_v1 or the framework measured-iteration window for query_only_framework_iteration_v1.'
    row_key: metrics.p50_a
    unit: ns
  b:
    aggregation: P50 of the per-repeat B values after subtraction.
    bioseq_cigar_interval_scope: For Block Aligner and KSW2, the CIGAR interval brackets the fused per-region base-alignment invocation, including DP, trace storage, traceback, CIGAR construction, and the required CIGAR-derived result fields.
    forbidden_derivations:
    - Subtract independently aggregated medians.
    - Add overlapping CIGAR and MAPQ durations without taking their interval union.
    - Subtract a downstream wall-time metric instead of the CIGAR/MAPQ interval union.
    interpretation_limit: B removes the instrumented CIGAR/MAPQ union, not an isolated traceback or formatting cost; on fused Bioseq paths it also removes the corresponding base-alignment work. It is not a universal seeding-plus-chaining-only timing.
    per_repeat_definition: For each repeat, B = A - union(CIGAR intervals, MAPQ intervals), where the merged half-open union prevents overlap from being subtracted twice.
    row_key: metrics.p50_b
    unit: ns
  classification: derived_non_authoritative
  clock_semantics:
    bioseq_intervals: Monotonic nanosecond durations from the finalized statement interval receipt and the identical framework clock implementation.
    duration_unit: Integer nanoseconds.
    framework_outer: Monotonic duration for the row's classified framework interval; the two timing scopes are retained and aggregated separately.
    minimap2_intervals: Monotonic nanosecond durations from the helper-declared monotonic clock receipt.
    subtraction_rate_gate: B is admitted only when outer and interval durations have a proven equal nanosecond rate.
    timestamp_rule: Absolute timestamps from different clock domains are neither subtracted nor compared; only nonnegative equal-rate durations are used.
  p50_method: Exact integer nearest-rank P50 over accepted repeats. With five repeats, sort the five per-repeat values and select the third.
  projection_description: Generated timing-semantics projection for the normative row metrics.
  timing_scope:
    allowed_values:
    - historical_outer_e2e_v1
    - query_only_framework_iteration_v1
    classification: non_metric_observation_scope
    historical_outer_e2e_v1: Frozen historical outer E2E interval; retained without reinterpretation.
    p50_partition_rule: Compute every row P50 solely within its timing_scope; never pool scopes.
    query_only_framework_iteration_v1: Framework iteration interval containing only the measured mapping operation.
validity_rules:
  classification: derived_non_authoritative
  current_campaign_expected_repeat_count: 5
  documented_fallback_exception: The 12 simd_minimap2_reference requests observed as scalar are approved only as scalar-fallback observations. Their requested_path comparison eligibility is false even though downstream validity and exact baseline equality passed.
  minimum_repeat_count: 5
  projection_description: Generated validation projection over approved_results, not a second publication dataset.
  requirements:
  - The row has accepted status and at least five complete accepted repeats.
  - Every repeat belongs to the same immutable tuple identity and uses compatible monotonic nanosecond duration clocks.
  - CIGAR and MAPQ projections are enabled and their finalized interval receipt supports the per-repeat B calculation.
  - metrics.p50_a and metrics.p50_b are non-null positive integers; metrics.p50_b is not greater than metrics.p50_a.
  - exact_baseline_match_count_equal is true for every approved row.
  - Selected and observed physical stages are audited; any difference is explicit in execution_conformance and comments.
  - No hidden biological fallback, decline, rejection, or prefilter activity is admitted.
  - Small-query calibration, partial repeats, rejected rows, invalid rows, and timeout diagnostics cannot supply an approved P50.
  value_disclosure: 'Returned-count values are intentionally omitted. The only row-level correctness disclosure is exact_baseline_match_count_equal: true.'
