    independent_recomputation_completed: true
    interpretation_or_comparison_dependency: false
    median_partition_rule: Each published row P50 is computed only from repeats carrying that row's timing_scope; observations from different scopes are never pooled.
    raw_repeat_observations_embedded: false
    scope: All 89 timing observations and 445 actual contributing runs were checked without combining P50 inputs across timing_scope values.
  generator: bioseq-approved-results-projection
  generator_inputs:
    base_alignment_label_renderer: bioseq::simd::base_alignment_algorithm_name
    chaining_label_renderer: bioseq::simd::chaining_algorithm_name
    minimizer_label_renderer: bioseq::simd::minimizer_algorithm_name
