  full_matrix_complete: false
  identity_contract_rule: Each row reuses the existing bioseq-e2e-cell-v2 aggregator identity through its stable_key_schema, canonical stable_key, and campaign_id. This file defines no parallel row-identity schema.
  no_external_path_or_reference_dependency: true
  normative_tuple_dataset: approved_results
  raw_repeat_timings_included: false
  sealed_verification_manifest_required_for_append: true
  single_source_of_truth_for_approved_results: true
  standalone_forensic_evidence_archive: false
projection_provenance:
  approved_results_projection_encoding: UTF-8 bytes of compact JSON for the complete approved_results sequence; rows are sorted by (stable_key, timing_scope), list order is retained, mapping keys are recursively lexicographically sorted, ensure_ascii=true, separators are comma and colon without spaces, YAML empty plain scalars normalize to JSON null, booleans use lowercase JSON literals, integers use shortest decimal notation, non-finite numbers are forbidden, and no terminal LF or other byte is appended.
  approved_results_projection_sha256: bf8f533e10a97e925a902ae93af4830df673274e01f59ceb2780cd5460ea0ba1
  classification: derived_non_authoritative
  current_p50_audit:
