deterministic_ordering:
  approved_results_sort_key: Ascending lexicographic (stable_key, timing_scope) observation identity; stable_key itself remains the unchanged logical tuple identity.
  classification: derived_non_authoritative
  expanded_key_order_projection: campaign_id, dataset, alphabet, target_size_gbp, kmer_size, window_size, mode as index_mode, pipeline as engine, projected bioseq_index_name, and the three requested algorithm keys, exactly as encoded by stable_key_contract.
  mapping_key_order_is_normative: false
  projection_description: Generated canonical-order explanation used to serialize approved_results deterministically; it is not a separate identity or tuple authority.
append_update_protocol:
  canonical_serializer:
    approved_results_digest_encoding: UTF-8 bytes of compact JSON for the complete approved_results sequence; rows are sorted by (stable_key, timing_scope), list order is retained, mapping keys are recursively lexicographically sorted, ensure_ascii=true, separators are comma and colon without spaces, YAML empty plain scalars normalize to JSON null, booleans use lowercase JSON literals, integers use shortest decimal notation, non-finite numbers are forbidden, and no terminal LF or other byte is appended.
    document_encoding: YAML 1.2, UTF-8, LF line endings, one terminal LF, no tags, anchors, aliases, or flow collections. YAML null is emitted only as an empty plain scalar, meaning a key followed by colon and no scalar; literal null is forbidden.
    mapping_order: Fixed generator order for deterministic bytes; mapping order carries no tuple semantics.
    name: bioseq-approved-results-yaml
    sequence_order: approved_results sorted by (stable_key, timing_scope); all other sequences retain generated semantic order.
    version: 3
  classification: derived_non_authoritative
  current_rows_receipt_semantics:
    complete_six_receipt_append_candidate: not_sealed
    immutable_scope_approved_results_projection_sha256: e463090b47dbe6446b6f1667a8ff23df99c8742be25ad190201a783d04d8cb78
    immutable_scope_generator_version: 2
    immutable_scope_row_count: 66
    interpretation: The current 66 rows predate the verification-manifest envelope. Their measurements and publication annotations remain approved; no proof identity/version is inferred or stored in a row, and interpretation does not depend on external evidence.
    per_row_receipt_identity_version_fields_present: false
    source_authority_sha256: d2c31ead65867d24e38f3b2b75a17cf1b6a5fc66bf49b5d83a3848faae918d5c
    status: legacy_not_sealed
    timing_scope: historical_outer_e2e_v1
  duplicate_policy:
    collision_rule: Reject when a stable_key fails to decode to its logical fields or when an observation pair is repeated.
    full_identity: stable_key is the logical cell tuple identity; timing_scope classifies a distinct timing observation.
    rule: Reject a candidate only when its exact (stable_key, timing_scope) observation identity already exists.
  existing_row_correction_policy: Do not overwrite, merge, renumber, or relabel an existing tuple. Stop and obtain an explicit authority-version decision if an accepted value is believed wrong.
  mode: additive_audited_rows_only
  projection_description: Generated publication workflow. approved_results remains the sole authority for approved publication rows. Published rows contain no raw-repeat or proof reference fields.
  remeasurement_policy: A query-only observation may coexist with its frozen historical row; the exact observation pair can never be silently replaced or replayed.
  sealed_append_candidate:
    approved_row_schema: Exactly stable_key_schema, stable_key, timing_scope, campaign_id, dataset, target_size_gbp, alphabet, kmer_size, window_size, query_count, mode, pipeline, pipeline_mode, index_type, requested_algorithms, observed_algorithms, effective_path, execution_conformance, comparison_eligibility, prefilter, exact_baseline_match_count_equal, status, run_count, metrics, comments, with the nested fields described by approved_row_field_guide.
    approved_row_storage_rule: Store no receipt, proof, filesystem path, URI, log location, or raw-repeat field in an approved row.
    candidate_shape: One nonempty sequence of complete query-only observation rows, sorted by (stable_key, timing_scope); an unscoped v1 candidate is forbidden.
    name: bioseq-approved-result-append-candidate
    projection_digest: candidate_projection_sha256 covers exactly the complete post-merge approved_results sequence; verification material is excluded.
    required_identity: campaign_id, stable_key_schema, canonical stable_key, timing_scope, and every stable-key component must agree exactly.
    verification_manifest:
      envelope_digest: candidate_envelope_sha256 uses the approved-results digest JSON rules over the entire candidate object with only candidate_envelope_sha256 omitted.
      name: bioseq-approved-result-verification-manifest
      nested_fields: Device and driver identity are inside measurement_contract payload. Exactly five logical-repeat records and their query partitions are inside chunk_plan payload; neither is a seventh proof category.
      observation_validation: For each candidate row, validate five complete integer A_ns, merged_CIGAR_MAPQ_union_ns, and derived B_ns observations; require B_ns equals A_ns minus the union, recompute the third-sorted A and B medians, require run_count five, and prove complete match-vector and total parity. Raw observations are intentionally omitted from this publication document.
      proof_categories:
      - source
      - build
      - fixture
      - config
      - measurement_contract
      - chunk_plan
      proof_object: Each category is embedded as identity, positive integer version, concrete lowercase sha256, and canonical payload. Paths, URIs, not_sealed, inferred values, and out-of-envelope data are forbidden.
      row_binding: Each candidate (stable_key, timing_scope) observation has exactly six internal identity/version bindings; bindings are never published.
      version: 2
    version: 2
  steps:
  - Acquire the named writer lock and verify the current publication seal before reading append inputs.
  - Freeze one sealed append candidate and validate its envelope digest, six embedded proof objects, and every internal row binding.
  - Require exactly five complete accepted repeat observations, exact baseline match-vector and total equality, physical-stage conformance, prefilter=false, and valid A/union/B arithmetic.
  - Compute per-repeat B before aggregating; publish only integer P50 A and P50 B plus run_count.
  - Construct the canonical bioseq-e2e-cell-v2 stable_key, retain it as the logical identity, and reject duplicate (stable_key, timing_scope) observation pairs before adding anything.
  - Copy requested and observed enum keys literally. Never infer an observed identity from the request and never relabel a fallback.
  - Add the sealed row, canonicalize approved_results, and preserve every existing approved row value exactly.
  - Recompute every derived_non_authoritative projection, vector, ordering description, approved_results projection digest, and count from the complete candidate state.
  - Serialize to the temporary, fsync it, strictly reparse and validate all exact temporary bytes, atomically replace only after that succeeds, fsync the directory, reread, and publish the new seal.
  transaction:
    failure_rule: Any proof, identity, P50, summary, vector, ordering, serialization, temporary-file validation, or seal failure before replacement leaves the prior publication bytes unchanged.
    post_replace_seal: Reread the final file and publish its byte count, LF-terminated line count, whole-document SHA-256, and approved_results projection SHA-256.
    pre_replace_validation: Reject duplicate keys, tags, anchors, aliases, flow collections, schema/math/digest/identity/order/uniqueness/derived-summary errors, or a changed input seal before replacement.
    replacement: Under the writer lock, write the fully recomputed document to a same-directory exclusive temporary, flush and fsync it, strictly parse and validate the exact temporary bytes, then and only then atomically replace the prior document and fsync the directory.
  writer:
    exclusivity: This is the only writer permitted to replace this publication document.
    lock:
      name: bioseq-approved-results-publication
      scope: Hold one exclusive repository-local lock across source seal verification, candidate construction, duplicate rejection, projection recomputation, validation, canonical serialization, and atomic replacement.
      stale_input_policy: Reject if the on-disk publication seal differs from the seal read after acquiring the lock.
      version: 1
    name: bioseq-approved-results-aggregator
    version: 2
invariants:
  checks:
  - approved_results contains accepted rows only.
  - Every row carries campaign_id bioseq-e2e-algorithm-matrix-local-v1, stable_key_schema bioseq-e2e-cell-v2, and the exact canonical stable_key recomputed through stable_key_contract.
  - Canonical stable keys remain unchanged logical identities; observation pairs (stable_key, timing_scope) are unique and approved_results is in ascending pair order.
  - Every run_count is exactly five.
  - Every metrics.unit is ns and every p50_a and p50_b is a non-null positive integer with p50_b <= p50_a.
  - Every P50, run_count, requested identity, and observed identity retains the approved value. The 71 non-null comments are publication annotations; 12 qualify scalar fallback and 1 qualify legacy user preservation, including zero ksw2_batched activity.
  - Every exact_baseline_match_count_equal is true; no returned-count value is stored.
  - Every row has prefilter=false.
  - No approved row uses an excluded runtime-only base-alignment algorithm.
  - A documented_scalar_minimizer_fallback row requests simd_minimap2_reference, observes scalar, exposes the scalar effective path, and has requested_path=false.
  - No other Bioseq row may have a requested/observed algorithm mismatch.
  - External minimap2 rows have null Bioseq requested and observed algorithm fields and index_type=minimap2_internal.
  - The current snapshot has exactly 140 timing observations, 121 logical cells, 74 query-only observations, and 700 actual contributing runs, including exactly 12 documented scalar-minimizer fallback observations.
  - Approved plus currently unapproved historical rejected and invalid plus missing cell counts reconcile to 1296. Five planned valid runs per cell reconcile to 6480; historical failed attempts are additional and are never counted as approved runs or as additional distinct cells.
  - The corrected user-intended valid-run vector is 50/40/45/40/80/80 and the historical RMQ-mislabeled vector is 15/40/0/40/80/80.
  - No approved row stores receipt identity, proof, raw-repeat, path, URI, or log-location fields; historical_outer_e2e_v1 remains exactly the pinned 66-row v2 projection and new observations use only query_only_framework_iteration_v1.
  classification: derived_non_authoritative
  projection_description: Generated validation assertions over the sole normative approved_results dataset and its explanatory projections.
