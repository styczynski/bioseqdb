  comments: 'External minimap2 prebuilt-index control on native ARM64 Clang 22. All five repeats returned the exact locally sealed 1,024-query count, strand, CIGAR replay, and MAPQ presence contract with maximum position offset 3 bp; each used one prebuilt index part, and physical CIGAR/MAPQ interval unions reproduce B as A minus union. No GPU/Vulkan path, prefilter, bioseq algorithm, or target-index build executed in the timed query phase. Severe host memory pressure and swapping were observed during timed prebuilt-query execution: the first timed helper reached MemAvailable 98,748 KiB and SwapFree 88,333,476 KiB of 108,605,212 KiB (20,271,736 KiB used), with helper VmHWM 7,238,280 KiB and VmSwap 14,595,324 KiB. This resource-pressure caveat is retained without invalidating, rerunning, or rebaselining the accepted measurements.'
