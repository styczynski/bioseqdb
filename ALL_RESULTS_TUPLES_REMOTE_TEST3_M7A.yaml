purpose: 'Host-local approved E2E timings for one sealed AWS CPU machine. The authority embeds its exact EC2, CPU, RAM, root-volume, and no-GPU inventory. Eligibility is the exact sealed 1,296-cell q1024 campaign stable-key set, independent of locally measured rows; the source-local hashes record structural bootstrap provenance only and contribute no result or timing. Linux E2E intervals use CLOCK_MONOTONIC under the existing strong same-kernel nanosecond-rate contract; unavailable Vulkan cells are non-executed dispositions, never zero-time results. Recovery policy authorized 2026-09-21: complete saved raw measurements may be accepted without ephemeral build/run receipts or a sealed append manifest. Recovered rows are explicitly annotated; this does not attest their exact source/binary provenance. Existing checks for five repeats, correctness, observed stages, disabled prefilter, timing intervals and minimap2 match counts remain required. No minimizer bit-parity is required.'
