schema_version: 1
created_at_utc: '2026-09-01T21:48:47+00:00'
experiment:
  title: Follow-up evaluation of the first-path Run_L predicate
  predicate_latex: Run_L(j,c) iff j >= L-1 and c <= n-L and for every u in [0,L-1], p[j-u] = j-u-1
  score_threshold: 40
  default_reference_filter_fraction: 0.0002
  lane_widths:
  - 4
  - 8
  - 16
methodology:
  sampling_unit: one independently generated query/reference replicate, identified by its master seed
  aggregation: median and interquartile range across defined replicate values at fixed arm, N, and L
  replicate_count_convention: figure n values count all generated replicates. Undefined metric values are omitted
    from that metric's median and interquartile range
  prohibited_aggregation: anchor and loop counters are not pooled across replicates
  null_policy: undefined rates remain YAML null, empty CSV cells, and gaps in curves. They are never encoded as
    zero
  endpoint_only_policy: arms sampled only at N=20 and N=4000 use unconnected markers. Adjacent endpoint-only cohorts
    receive fixed 5-point horizontal display-space offsets when needed to expose overlap. Their stored x values
    remain the measured N
  eligibility: score_gate_eligible is reported before Run_L rates. It records whether the score gate found a ranked
    end and does not apply minimap2's later minimum-count gate. No score-qualified ranked end means the Run_L rates
    are undefined
  exact_rate: fast_batches / loop_evaluations for the initial DP backtrack
  conditional_contiguity: fast_batches / bounds_pass for the initial DP backtrack
  path_coverage: fast_covered_anchors / primary_path_anchors for the initial DP backtrack
  filter_diagnostics:
    mid_occ_per_copy: mid_occ / (N + 1), where N + 1 is the first integer cutoff above N planted copies
    retained_anchors_per_copy: retained_anchor_count / N
    default_filter_tail_budget: ceil(0.0002 * D), where D is the number of distinct reference minimizer keys
