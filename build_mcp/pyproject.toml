[tool.poetry]
name = "bioseq-build-mcp"
version = "2.0.0"
description = "bioseq build + document MCP server"
authors = ["bioseqdb <dev@bioseqdb.local>"]
# no package-mode key (poetry 1.3.2); install with `poetry install --no-root`

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
jsonschema = "^4.21"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"
