<title id="title">Where substitution scores enter seed and extend</title>
<desc id="desc">The first panel finds exact DNA words shared by reference and query. The second connects anchors using their coordinates and gaps. The third compares individual letters and gap runs within selected regions. Nucleotide alignment uses DNA scores; PAM and BLOSUM are protein substitution matrices.</desc>
<text x="24" y="42" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="var(--theme-eef4f9, #eef4f9)">Three stages, different things to score</text>
