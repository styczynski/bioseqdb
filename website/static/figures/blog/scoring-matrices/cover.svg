<title id="title">Sequence changes and substitution matrices</title>
<desc id="desc">Two schematic DNA double helices show an A:T base pair replaced by G:C. A nucleotide matrix thumbnail and a separate protein-letter matrix flank the helices. The colored matrix cells are decorative, not measured values.</desc>
