<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-20364a:#ccd9e4;--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-c5a8d6:#7d468c;--theme-eef4f9:#173247;--theme-f4894f:#b44d1c;}}</style>
<title id="title">Constant, linear, affine and two-piece affine gap costs</title>
<desc id="desc">An illustrative chart plots gap lengths 1 to 24. Constant cost stays at 6, linear cost is twice the length, and affine cost is 5 plus the length. A dashed two-piece affine curve takes the smaller of 5 plus length and 15 plus one quarter of length; its slope changes at length 13 and one third. Under this affine convention a gap of length one costs 6, a gap of length three costs 8, and three separate gaps of length one cost 18.</desc>
<text x="24" y="42" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="var(--theme-eef4f9, #eef4f9)">Opening a gap and extending a gap</text>
<text x="24" y="81" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="var(--theme-a9bccb, #a9bccb)">Illustrative costs, subtracted from alignment scores</text>
