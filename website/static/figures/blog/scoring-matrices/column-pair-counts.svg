<svg xmlns="http://www.w3.org/2000/svg" width="720" height="765" viewBox="0 0 720 765" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-c5a8d6:#7d468c;--theme-eef4f9:#173247;--theme-f4894f:#b44d1c;}}</style>
<title id="title">Count unordered amino-acid pairs within a column</title>
<desc id="desc">Six unweighted aligned amino acids A A A A I L yield 15 unordered sequence pairs. There are six A-A pairs, four A-I pairs, four A-L pairs and one I-L pair. BLOSUM additionally groups similar sequences and counts between groups to reduce redundancy.</desc>
<text x="24" y="42" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="var(--theme-eef4f9, #eef4f9)">One alignment column gives 15 pairs</text>
<text x="24" y="80" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="var(--theme-a9bccb, #a9bccb)">Six sequences · unweighted teaching example</text>
<rect x="42" y="119" width="76" height="76" rx="8" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity="0.14"/><text x="80.0" y="171.44" font-family="monospace" font-size="39.52" font-weight="bold" text-anchor="middle" fill="var(--theme-74c8a8, #74c8a8)">A</text>
<rect x="150" y="119" width="76" height="76" rx="8" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity="0.14"/><text x="188.0" y="171.44" font-family="monospace" font-size="39.52" font-weight="bold" text-anchor="middle" fill="var(--theme-74c8a8, #74c8a8)">A</text>
<rect x="258" y="119" width="76" height="76" rx="8" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity="0.14"/><text x="296.0" y="171.44" font-family="monospace" font-size="39.52" font-weight="bold" text-anchor="middle" fill="var(--theme-74c8a8, #74c8a8)">A</text>
<rect x="366" y="119" width="76" height="76" rx="8" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity="0.14"/><text x="404.0" y="171.44" font-family="monospace" font-size="39.52" font-weight="bold" text-anchor="middle" fill="var(--theme-74c8a8, #74c8a8)">A</text>
<rect x="474" y="119" width="76" height="76" rx="8" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity="0.14"/><text x="512.0" y="171.44" font-family="monospace" font-size="39.52" font-weight="bold" text-anchor="middle" fill="var(--theme-65b9dd, #65b9dd)">I</text>
<rect x="582" y="119" width="76" height="76" rx="8" fill="var(--theme-c5a8d6, #c5a8d6)" fill-opacity="0.14"/><text x="620.0" y="171.44" font-family="monospace" font-size="39.52" font-weight="bold" text-anchor="middle" fill="var(--theme-c5a8d6, #c5a8d6)">L</text>
<text x="360" y="236" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="var(--theme-eef4f9, #eef4f9)">Each pair of sequences contributes once.</text>
<text x="360" y="279" font-family="monospace" font-size="29" font-weight="bold" text-anchor="middle" fill="var(--theme-74c8a8, #74c8a8)">6 × 5 / 2 = 15</text>
<rect x="24" y="314" width="672" height="51" rx="9" fill="var(--theme-0a1826, #0a1826)" />
<text x="43" y="348" font-family="monospace" font-size="26" font-weight="bold" text-anchor="start" fill="var(--theme-74c8a8, #74c8a8)">A–A</text>
<rect x="156" y="327" width="192" height="25" rx="5" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".4"/>
<text x="400" y="348" font-family="monospace" font-size="27" font-weight="bold" text-anchor="middle" fill="var(--theme-74c8a8, #74c8a8)">6</text>
<text x="666" y="348" font-family="monospace" font-size="24" font-weight="normal" text-anchor="end" fill="var(--theme-a9bccb, #a9bccb)">4 × 3 / 2</text>
<rect x="24" y="375" width="672" height="51" rx="9" fill="var(--theme-0a1826, #0a1826)" />
<text x="43" y="409" font-family="monospace" font-size="26" font-weight="bold" text-anchor="start" fill="var(--theme-65b9dd, #65b9dd)">A–I</text>
<rect x="156" y="388" width="128" height="25" rx="5" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".4"/>
<text x="400" y="409" font-family="monospace" font-size="27" font-weight="bold" text-anchor="middle" fill="var(--theme-65b9dd, #65b9dd)">4</text>
<text x="666" y="409" font-family="monospace" font-size="24" font-weight="normal" text-anchor="end" fill="var(--theme-a9bccb, #a9bccb)">4 × 1</text>
<rect x="24" y="436" width="672" height="51" rx="9" fill="var(--theme-0a1826, #0a1826)" />
<text x="43" y="470" font-family="monospace" font-size="26" font-weight="bold" text-anchor="start" fill="var(--theme-c5a8d6, #c5a8d6)">A–L</text>
<rect x="156" y="449" width="128" height="25" rx="5" fill="var(--theme-c5a8d6, #c5a8d6)" fill-opacity=".4"/>
<text x="400" y="470" font-family="monospace" font-size="27" font-weight="bold" text-anchor="middle" fill="var(--theme-c5a8d6, #c5a8d6)">4</text>
<text x="666" y="470" font-family="monospace" font-size="24" font-weight="normal" text-anchor="end" fill="var(--theme-a9bccb, #a9bccb)">4 × 1</text>
<rect x="24" y="497" width="672" height="51" rx="9" fill="var(--theme-0a1826, #0a1826)" />
<text x="43" y="531" font-family="monospace" font-size="26" font-weight="bold" text-anchor="start" fill="var(--theme-f4894f, #f4894f)">I–L</text>
<rect x="156" y="510" width="32" height="25" rx="5" fill="var(--theme-f4894f, #f4894f)" fill-opacity=".4"/>
<text x="400" y="531" font-family="monospace" font-size="27" font-weight="bold" text-anchor="middle" fill="var(--theme-f4894f, #f4894f)">1</text>
<text x="666" y="531" font-family="monospace" font-size="24" font-weight="normal" text-anchor="end" fill="var(--theme-a9bccb, #a9bccb)">1 × 1</text>
<text x="24" y="611" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="var(--theme-eef4f9, #eef4f9)">Observed pair frequency: count / 15</text>
<text x="24" y="651" font-family="monospace" font-size="25" font-weight="normal" text-anchor="start" fill="var(--theme-65b9dd, #65b9dd)">For example, q(A,I) = 4 / 15</text>
<text x="24" y="700" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="var(--theme-a9bccb, #a9bccb)">BLOSUM groups similar sequences before</text>
<text x="24" y="734" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="var(--theme-a9bccb, #a9bccb)">counting between groups, reducing redundancy.</text>
</svg>
