<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-20364a:#ccd9e4;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;--theme-f4894f:#b44d1c;}}</style>
<title id="title">Identity scores and BLOSUM62 protein scores</title>
<desc id="desc">For amino acids L, I, G and W, an identity matrix gives every mismatch minus one. BLOSUM62 instead gives leucine-isoleucine plus two and glycine-tryptophan minus two. The matrix rows and columns are L, I, G, W: 4,2,-4,-2; 2,4,-4,-3; -4,-4,6,-2; -2,-3,-2,11. These are protein scores, not nucleotide scores.</desc>
<text x="24" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="var(--theme-eef4f9, #eef4f9)">A different score for each amino-acid pair</text>
<text x="24" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="var(--theme-a9bccb, #a9bccb)">The same four protein letters, two scoring schemes</text>
<text x="180" y="133" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="var(--theme-eef4f9, #eef4f9)">Identity: +1 / −1</text>
