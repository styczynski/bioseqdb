    <stop stop-color="white" stop-opacity=".25"/>
    <stop offset=".18" stop-color="white" stop-opacity="1"/>
    <stop offset=".82" stop-color="white" stop-opacity="1"/>
    <stop offset="1" stop-color="white" stop-opacity=".25"/>
  </linearGradient>
  <mask id="cover-mask" mask-type="alpha"><rect width="1440" height="240" fill="url(#cover-fade)"/></mask>
</defs>
<g mask="url(#cover-mask)">
  <g fill="none" stroke="var(--theme-a9bccb, #a9bccb)" stroke-width="1" opacity=".18">
    <path d="M0 171 H1440 M0 202 H1440"/>
    <path d="M85 159 V210 M215 159 V210 M345 159 V210 M475 159 V210 M605 159 V210 M735 159 V210 M865 159 V210 M995 159 V210 M1125 159 V210 M1255 159 V210 M1385 159 V210"/>
