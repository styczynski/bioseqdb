<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-c9a8ff:#735091;--theme-f4894f:#b44d1c;}}</style>
<title id="title">Sequence letters meet SQL</title>
<desc id="desc">Large translucent A, C, G and T letters run behind SELECT, WHERE and GROUP BY labels. Thin lines connect sequence positions to a small table, suggesting filtering and grouping. This is a decorative diagram, with no measured data.</desc>
<defs>
