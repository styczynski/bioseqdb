<title id="title">Dense versus sparse candidate anchor scores</title><desc id="desc">Two executable teaching fixtures for the final mapper score formula. Dense anchors (100,0),(110,10),(120,20),(130,30) score0.300. Sparse anchors (100,0),(130,10),(160,20),(190,30) score0.105. Both have a read span of30; only the second has uncovered reference gaps beyond k=17. Read length is100. Coordinates are illustrative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Arial, sans-serif" fill="var(--theme-eef4f9, #eef4f9)"><text x="24" y="43" font-size="29" font-weight="bold">More span is not always a better window</text><text x="24" y="84" font-size="23" fill="var(--theme-a9bccb, #a9bccb)">Teaching score · read length 100 · k = 17</text><rect x="24" y="131" width="562" height="171" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)"/><text x="43" y="166" font-size="25" font-weight="bold" fill="var(--theme-74c8a8, #74c8a8)">Dense</text><text x="557" y="166" text-anchor="end" font-size="24" fill="var(--theme-74c8a8, #74c8a8)">score .300</text><text x="43" y="209" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Ref.</text><text x="43" y="262" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Read</text><text x="172" y="209" text-anchor="middle" font-family="monospace" font-size="24">100</text><text x="172" y="262" text-anchor="middle" font-family="monospace" font-size="24">0</text><path d="M172 220 V235" stroke="var(--theme-74c8a8, #74c8a8)" stroke-width="2"/><text x="282" y="209" text-anchor="middle" font-family="monospace" font-size="24">110</text><text x="282" y="262" text-anchor="middle" font-family="monospace" font-size="24">10</text><path d="M282 220 V235" stroke="var(--theme-74c8a8, #74c8a8)" stroke-width="2"/><text x="392" y="209" text-anchor="middle" font-family="monospace" font-size="24">120</text><text x="392" y="262" text-anchor="middle" font-family="monospace" font-size="24">20</text><path d="M392 220 V235" stroke="var(--theme-74c8a8, #74c8a8)" stroke-width="2"/><text x="502" y="209" text-anchor="middle" font-family="monospace" font-size="24">130</text><text x="502" y="262" text-anchor="middle" font-family="monospace" font-size="24">30</text><path d="M502 220 V235" stroke="var(--theme-74c8a8, #74c8a8)" stroke-width="2"/><rect x="24" y="334" width="562" height="171" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)"/><text x="43" y="369" font-size="25" font-weight="bold" fill="var(--theme-f4894f, #f4894f)">Sparse</text><text x="557" y="369" text-anchor="end" font-size="24" fill="var(--theme-f4894f, #f4894f)">score .105</text><text x="43" y="412" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Ref.</text><text x="43" y="465" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Read</text><text x="172" y="412" text-anchor="middle" font-family="monospace" font-size="24">100</text><text x="172" y="465" text-anchor="middle" font-family="monospace" font-size="24">0</text><path d="M172 423 V438" stroke="var(--theme-f4894f, #f4894f)" stroke-width="2"/><text x="282" y="412" text-anchor="middle" font-family="monospace" font-size="24">130</text><text x="282" y="465" text-anchor="middle" font-family="monospace" font-size="24">10</text><path d="M282 423 V438" stroke="var(--theme-f4894f, #f4894f)" stroke-width="2"/><text x="392" y="412" text-anchor="middle" font-family="monospace" font-size="24">160</text><text x="392" y="465" text-anchor="middle" font-family="monospace" font-size="24">20</text><path d="M392 423 V438" stroke="var(--theme-f4894f, #f4894f)" stroke-width="2"/><text x="502" y="412" text-anchor="middle" font-family="monospace" font-size="24">190</text><text x="502" y="465" text-anchor="middle" font-family="monospace" font-size="24">30</text><path d="M502 423 V438" stroke="var(--theme-f4894f, #f4894f)" stroke-width="2"/><text x="24" y="554" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">The sparse chain pays for uncovered reference gaps.</text></g></svg>