<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame ancestors in meta</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
</head>
<body>
<h1>Frame ancestors in meta</h1>
<p>frame-ancestors is header-only (§15.5) and must not appear in the meta CSP.</p>
</body>
</html>
