index:
  how_the_index_works: How the index works
  from_long_sequences_to_small_searchable_seeds: BioseqDB was created based on minimap2 design
  before_search_runs_bioseqdb_turns_each_sequence: Before search runs, BioseqDB turns each sequence
    into a set of compact seeds. It picks representative k-mers as minimizers, tolerates gaps
    with spaced seeds, and links distant k-mers into strobemers. Those seeds are what mmsearch
    looks up, which is why search stays fast as collections grow.
  value_01: '01'
  minimizers: Minimizers
  a_minimizer_is_the_most_compact_way: A minimizer is the most compact way to seed a sequence.
    BioseqDB slides a short window along the read, hashes every k-mer inside it, and keeps only
    the one with the smallest hash. Neighboring windows usually agree on that k-mer, so a long
    sequence reduces to a small, stable set of seeds.
  window_4_k_mers_k_7: Window · 4 k-mers · k = 7
