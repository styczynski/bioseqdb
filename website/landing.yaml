# Edit the landing page text here, then rebuild the website with CMake.
# Keys are stable bindings to the supplied design; changing values never changes
# the layout, classes, annotation hooks, or the SQL executed by the builder.
# Inline styling splits a few sentences across neighboring entries. Keep those
# fragments in reading order. SQL examples live in v0.1/landing_examples.md.
# The header section is shared by the landing, documentation, and benchmarks.
# This file is authored content: the design translator never overwrites it.

meta:
  title: BioseqDB
  description: BioseqDB is an experimental Postgres extension providing complete overhaul of relational storage. Now you can load FASTA and FASTQ files, store sequences (even larger than 160Gbs!) beside any metadata, and search them with
    ordinary SQL.
