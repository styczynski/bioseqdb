  stable_key_encoding: 'The literal prefix bioseq-e2e-cell-v2: followed by a compact JSON array of the
    ordered field values, encoded with ensure_ascii=true and separators comma and colon.'
  stable_key_schema: bioseq-e2e-cell-v2
  validation_rule: Decode each stable_key and compare its twelve values with the row field projection.
