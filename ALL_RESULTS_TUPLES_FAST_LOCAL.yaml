  projection_description: Generated descriptive projection for interpreting approved_results. Literal
    keys record the aggregator-observed configuration values; labels are explanatory only, requested and
    observed identities are separate facts, and code enums remain authoritative.
metric_definitions:
  a:
    aggregation: One accepted sample; P50 equals its value.
    per_repeat_definition: Framework measured-iteration window for mapping with CIGAR and MAPQ.
    row_key: metrics.p50_a
    unit: ns
  b:
    aggregation: One accepted sample after subtracting its CIGAR/MAPQ interval union.
    bioseq_cigar_interval_scope: For Block Aligner and KSW2, the CIGAR interval brackets the fused per-region
      base-alignment invocation, including DP, trace storage, traceback, CIGAR construction, and the required
      CIGAR-derived result fields.
    forbidden_derivations:
    - Subtract independently aggregated medians.
    - Add overlapping CIGAR and MAPQ durations without taking their interval union.
    - Subtract a downstream wall-time metric instead of the CIGAR/MAPQ interval union.
    interpretation_limit: B removes the instrumented CIGAR/MAPQ union, not an isolated traceback or formatting
      cost; on fused Bioseq paths it also removes the corresponding base-alignment work. It is not a universal
      seeding-plus-chaining-only timing.
    per_repeat_definition: For each repeat, B = A - union(CIGAR intervals, MAPQ intervals), where the
      merged half-open union prevents overlap from being subtracted twice.
    row_key: metrics.p50_b
    unit: ns
  classification: derived_non_authoritative
  clock_semantics:
    bioseq_intervals: Monotonic nanosecond durations from the finalized statement interval receipt and
      the identical framework clock implementation.
    duration_unit: Integer nanoseconds.
    framework_outer: Monotonic duration of the one framework measured-iteration window.
    minimap2_intervals: Monotonic nanosecond durations from the helper-declared monotonic clock receipt.
    subtraction_rate_gate: B is admitted only when outer and interval durations have a proven equal nanosecond
      rate.
    timestamp_rule: Absolute timestamps from different clock domains are neither subtracted nor compared;
      only nonnegative equal-rate durations are used.
  p50_method: Single-sample identity, not a statistical five-repeat estimate.
  projection_description: Generated timing-semantics projection for the normative row metrics.
  timing_scope:
    allowed_values:
    - query_only_framework_iteration_fast_local_single_sample_v1
    classification: non_metric_observation_scope
    p50_partition_rule: FAST LOCAL one-sample methodology; never pool with standard five-repeat rows.
validity_rules:
  classification: derived_non_authoritative
  current_campaign_expected_repeat_count: 1
  documented_fallback_exception: Any admitted known fallback is described per row; requested_path is false
    when a different engine ran.
  minimum_repeat_count: 1
  projection_description: Generated validation projection over approved_results, not a second publication
    dataset.
  requirements:
  - The row has accepted status and exactly one complete accepted sample.
  - Every repeat belongs to the same immutable tuple identity and uses compatible monotonic nanosecond
    duration clocks.
  - CIGAR and MAPQ projections are enabled and their finalized interval receipt supports the per-repeat
    B calculation.
  - metrics.p50_a and metrics.p50_b are non-null positive integers; metrics.p50_b is not greater than
    metrics.p50_a.
  - exact_baseline_match_count_equal is true for every approved row.
  - Selected and observed physical stages are audited; any difference is explicit in execution_conformance
    and comments.
  - No hidden biological fallback, decline, rejection, or prefilter activity is admitted.
  - Small-query calibration, partial repeats, rejected rows, invalid rows, and timeout diagnostics cannot
    supply an approved P50.
  value_disclosure: 'Returned-count values are intentionally omitted. The only row-level correctness disclosure
    is exact_baseline_match_count_equal: true.'
