---
schema: bioseq.approved-e2e-result-tuples
version: 3
status: approved_partial_matrix
purpose: Self-contained authority for FAST LOCAL q1024 E2E measurements authorized 2026-09-22. One sample
  per previously unapproved local tuple; P50 equals that single observation and is not a five-repeat median
  estimate. All just_index groups precede no_index. A compatible persisted index is reused across chaining/alignment
  configurations for the same target content, alphabet, index type, producer and k/w. PostgreSQL restarts
  before each measurement; OS filesystem cache is not cleared. Index creation, restart and post-measurement
  validation are untimed. Original five-repeat results remain separate and unchanged. Existing approved-row
  fields are preserved; run_count=1, timing_scope and comments identify this methodology. approved_results
  is the sole numerical authority; no external files are needed to interpret it. The standard five-repeat
  document validator must not be used to relabel these rows as standard measurements.
authority:
  all_other_sections: derived_non_authoritative
  approved_snapshot_complete: true
  contains_only_approved_rows: true
  enum_authority_rule: Terminology below is a descriptive generated projection. It neither defines nor
    supersedes configuration or runtime code enums.
  external_lookup_required_to_interpret: false
  frozen_evidence_archive_is_publication_authority: false
  full_matrix_complete: false
  identity_contract_rule: Each row reuses the existing bioseq-e2e-cell-v2 aggregator identity through
    its stable_key_schema, canonical stable_key, and campaign_id. This file defines no parallel row-identity
    schema.
  no_external_path_or_reference_dependency: true
  normative_tuple_dataset: approved_results
  raw_repeat_timings_included: false
  sealed_verification_manifest_required_for_append: false
  single_source_of_truth_for_approved_results: true
  standalone_forensic_evidence_archive: false
