<svg xmlns="http://www.w3.org/2000/svg" width="610" height="370" viewBox="0 0 610 370" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-c5a8d6:#7d468c;--theme-eef4f9:#173247;--theme-f4894f:#b44d1c;}}</style>
<title id="title">Aligned letters reveal substitutions, insertions and deletions</title><desc id="desc">Reference ACTGACGT and read ACTATACT are aligned using one substitution, one insertion and one deletion. The inserted T aligns with a reference gap, and the deleted G aligns with a read gap. This schematic is separate from the executable mapping fixture.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Arial, sans-serif" fill="var(--theme-eef4f9, #eef4f9)"><text x="24" y="42" font-size="29" font-weight="bold">An alignment makes edits visible</text><text x="24" y="81" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">Gaps keep the surrounding letters lined up.</text><text x="24" y="162" font-size="21">Reference</text><rect x="153" y="127" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="173" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">A</text><rect x="200" y="127" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="220" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">C</text><rect x="247" y="127" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="267" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">T</text><rect x="294" y="127" width="40" height="46" rx="7" fill="var(--theme-f4894f, #f4894f)" fill-opacity=".12" stroke="var(--theme-f4894f, #f4894f)"/><text x="314" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-f4894f, #f4894f)">G</text><rect x="341" y="127" width="40" height="46" rx="7" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".12" stroke="var(--theme-65b9dd, #65b9dd)"/><text x="361" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-65b9dd, #65b9dd)">-</text><rect x="388" y="127" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="408" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">A</text><rect x="435" y="127" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="455" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">C</text><rect x="482" y="127" width="40" height="46" rx="7" fill="var(--theme-c5a8d6, #c5a8d6)" fill-opacity=".12" stroke="var(--theme-c5a8d6, #c5a8d6)"/><text x="502" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-c5a8d6, #c5a8d6)">G</text><rect x="529" y="127" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="549" y="160" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">T</text><text x="24" y="228" font-size="21">Read</text><rect x="153" y="193" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="173" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">A</text><rect x="200" y="193" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="220" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">C</text><rect x="247" y="193" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="267" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">T</text><rect x="294" y="193" width="40" height="46" rx="7" fill="var(--theme-f4894f, #f4894f)" fill-opacity=".12" stroke="var(--theme-f4894f, #f4894f)"/><text x="314" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-f4894f, #f4894f)">A</text><rect x="341" y="193" width="40" height="46" rx="7" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".12" stroke="var(--theme-65b9dd, #65b9dd)"/><text x="361" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-65b9dd, #65b9dd)">T</text><rect x="388" y="193" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="408" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">A</text><rect x="435" y="193" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="455" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">C</text><rect x="482" y="193" width="40" height="46" rx="7" fill="var(--theme-c5a8d6, #c5a8d6)" fill-opacity=".12" stroke="var(--theme-c5a8d6, #c5a8d6)"/><text x="502" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-c5a8d6, #c5a8d6)">-</text><rect x="529" y="193" width="40" height="46" rx="7" fill="var(--theme-74c8a8, #74c8a8)" fill-opacity=".12" stroke="var(--theme-74c8a8, #74c8a8)"/><text x="549" y="226" text-anchor="middle" font-family="monospace" font-size="28" fill="var(--theme-74c8a8, #74c8a8)">T</text><circle cx="31" cy="284" r="6" fill="var(--theme-f4894f, #f4894f)"/><text x="46" y="291" font-size="23" fill="var(--theme-f4894f, #f4894f)">Substitution</text><circle cx="242" cy="284" r="6" fill="var(--theme-65b9dd, #65b9dd)"/><text x="257" y="291" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">Insertion</text><circle cx="431" cy="284" r="6" fill="var(--theme-c5a8d6, #c5a8d6)"/><text x="446" y="291" font-size="23" fill="var(--theme-c5a8d6, #c5a8d6)">Deletion</text><text x="24" y="340" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">The mapper locates the interval containing this match.</text></g></svg>