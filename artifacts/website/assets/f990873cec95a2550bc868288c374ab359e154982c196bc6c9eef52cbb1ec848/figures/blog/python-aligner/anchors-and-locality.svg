<svg xmlns="http://www.w3.org/2000/svg" width="610" height="574" viewBox="0 0 610 574" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-65b9dd:#146c91;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;--theme-f4894f:#b44d1c;}}</style>
<title id="title">A monotone anchor chain can include a distant tail</title><desc id="desc">Schematic reference-versus-read anchor scatter plot. An increasing chain joins three early anchors to a separate dense local group across a large reference gap. The prototype uses a distance cutoff and local-window scores instead of assuming the longest increasing chain is automatically one good mapping. This is a conceptual example, not a measured read.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Arial, sans-serif" fill="var(--theme-eef4f9, #eef4f9)"><text x="24" y="43" font-size="29" font-weight="bold">Increasing anchors can span two places</text><text x="24" y="84" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">Order alone does not identify a good local match.</text><path d="M85 405 H571 M85 405 V120" stroke="var(--theme-a9bccb, #a9bccb)" stroke-width="2"/><text x="313" y="455" text-anchor="middle" font-size="23" fill="var(--theme-a9bccb, #a9bccb)">Reference position →</text><text x="24" y="115" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">Read</text><text x="24" y="144" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">pos.</text><path d="M111 374 L138 354" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><path d="M138 354 L165 334" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><path d="M165 334 L359 274" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><path d="M359 274 L392 247" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><path d="M392 247 L425 218" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><path d="M425 218 L458 191" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><path d="M458 191 L491 160" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3" stroke-dasharray="7 6"/><circle cx="111" cy="374" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="138" cy="354" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="165" cy="334" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="359" cy="274" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="392" cy="247" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="425" cy="218" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="458" cy="191" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><circle cx="491" cy="160" r="7" fill="var(--theme-65b9dd, #65b9dd)"/><rect x="335" y="132" width="180" height="168" rx="18" fill="var(--theme-f4894f, #f4894f)" fill-opacity=".09" stroke="var(--theme-f4894f, #f4894f)" stroke-width="2"/><text x="424" y="329" text-anchor="middle" font-size="23" fill="var(--theme-f4894f, #f4894f)">local candidate</text><text x="237" y="263" text-anchor="middle" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">large gap</text><path d="M236 274 V310" stroke="var(--theme-a9bccb, #a9bccb)" stroke-width="2"/><text x="24" y="507" font-size="23" fill="var(--theme-a9bccb, #a9bccb)">The prototype limits gaps and scores local windows.</text><text x="24" y="542" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">This is a heuristic, not an optimal-chain guarantee.</text></g></svg>