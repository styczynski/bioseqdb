<svg xmlns="http://www.w3.org/2000/svg" width="610" height="588" viewBox="0 0 610 588" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-65b9dd:#146c91;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;}}</style>
<title id="title">Three sliding windows select minimizers in ACGTAC</title><desc id="desc">Runnable teaching example with k=3 and w=2. Two-bit k-mer keys and start positions are ACG=6 at0, CGT=27 at1, GTA=44 at2, TAC=49 at3. Consecutive two-k-mer windows select keys6,27,44 at positions0,1,2. Ties choose the leftmost occurrence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Arial, sans-serif" fill="var(--theme-eef4f9, #eef4f9)"><text x="24" y="43" font-size="29" font-weight="bold">A minimum in each sliding window</text><text x="24" y="85" font-size="24" fill="var(--theme-a9bccb, #a9bccb)">ACGTAC · k = 3 · w = 2 k-mers</text><text x="24" y="123" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">A=0, C=1, G=2, T=3 · positions start at zero</text><text x="24" y="197" font-size="22">Window 1</text><rect x="169" y="160" width="117" height="76" rx="10" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".12" stroke="var(--theme-65b9dd, #65b9dd)"/><text x="227" y="190" text-anchor="middle" font-family="monospace" font-size="25" fill="var(--theme-65b9dd, #65b9dd)">ACG</text><text x="227" y="220" text-anchor="middle" font-size="21" fill="var(--theme-65b9dd, #65b9dd)">key 6</text><rect x="304" y="160" width="117" height="76" rx="10" fill="var(--theme-a9bccb, #a9bccb)" fill-opacity=".12" stroke="var(--theme-a9bccb, #a9bccb)"/><text x="362" y="190" text-anchor="middle" font-family="monospace" font-size="25" fill="var(--theme-a9bccb, #a9bccb)">CGT</text><text x="362" y="220" text-anchor="middle" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">key 27</text><path d="M437 196 H471" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><text x="491" y="190" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">keep 6</text><text x="491" y="220" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">at 0</text><text x="24" y="313" font-size="22">Window 2</text><rect x="169" y="276" width="117" height="76" rx="10" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".12" stroke="var(--theme-65b9dd, #65b9dd)"/><text x="227" y="306" text-anchor="middle" font-family="monospace" font-size="25" fill="var(--theme-65b9dd, #65b9dd)">CGT</text><text x="227" y="336" text-anchor="middle" font-size="21" fill="var(--theme-65b9dd, #65b9dd)">key 27</text><rect x="304" y="276" width="117" height="76" rx="10" fill="var(--theme-a9bccb, #a9bccb)" fill-opacity=".12" stroke="var(--theme-a9bccb, #a9bccb)"/><text x="362" y="306" text-anchor="middle" font-family="monospace" font-size="25" fill="var(--theme-a9bccb, #a9bccb)">GTA</text><text x="362" y="336" text-anchor="middle" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">key 44</text><path d="M437 312 H471" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><text x="491" y="306" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">keep 27</text><text x="491" y="336" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">at 1</text><text x="24" y="429" font-size="22">Window 3</text><rect x="169" y="392" width="117" height="76" rx="10" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".12" stroke="var(--theme-65b9dd, #65b9dd)"/><text x="227" y="422" text-anchor="middle" font-family="monospace" font-size="25" fill="var(--theme-65b9dd, #65b9dd)">GTA</text><text x="227" y="452" text-anchor="middle" font-size="21" fill="var(--theme-65b9dd, #65b9dd)">key 44</text><rect x="304" y="392" width="117" height="76" rx="10" fill="var(--theme-a9bccb, #a9bccb)" fill-opacity=".12" stroke="var(--theme-a9bccb, #a9bccb)"/><text x="362" y="422" text-anchor="middle" font-family="monospace" font-size="25" fill="var(--theme-a9bccb, #a9bccb)">TAC</text><text x="362" y="452" text-anchor="middle" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">key 49</text><path d="M437 428 H471" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><text x="491" y="422" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">keep 44</text><text x="491" y="452" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">at 2</text><text x="24" y="555" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">One selected position may belong to several windows.</text></g></svg>