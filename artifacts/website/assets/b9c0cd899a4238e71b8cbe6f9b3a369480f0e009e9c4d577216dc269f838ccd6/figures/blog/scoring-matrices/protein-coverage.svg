<title id="chart-title">Coding regions retained for amino-acid counting</title>
<desc id="chart-description">Each bar starts with the full cohort. A coding region is excluded for insertions, deletions, incomplete alignment, premature stops, or invalid or ambiguous initiation codons. Ambiguous internal codons are counted separately.</desc>

