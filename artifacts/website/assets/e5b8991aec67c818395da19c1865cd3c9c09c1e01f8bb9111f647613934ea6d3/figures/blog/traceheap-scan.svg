<svg xmlns="http://www.w3.org/2000/svg" width="640" height="478" viewBox="0 0 640 478" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-20364a:#ccd9e4;--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;}}</style>
<title id="title">Four row deliveries, two query results</title>
<desc id="desc">The sequential table scan delivers soil with 120 reads, river with 900, leaf with 480 and air with 60. The executor keeps only rows with at least 400 reads. The table callback counter is four; the output contains river and leaf.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Inter,Arial,sans-serif">
<text x="16" y="36" font-size="27" font-weight="600" fill="var(--theme-eef4f9, #eef4f9)">scan_getnextslot()</text>
<text x="350" y="36" font-size="27" font-weight="600" fill="var(--theme-eef4f9, #eef4f9)">Executor filter</text>
<g fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2">
<rect x="12" y="61" width="274" height="62" rx="12"/>
<rect x="12" y="145" width="274" height="62" rx="12"/>
<rect x="12" y="229" width="274" height="62" rx="12"/>
<rect x="12" y="313" width="274" height="62" rx="12"/>
<rect x="340" y="102" width="288" height="232" rx="16"/>
</g>
<g font-size="25" fill="var(--theme-a9bccb, #a9bccb)"><text x="32" y="101">1 · soil</text><text x="205" y="101">120</text><text x="32" y="353">4 · air</text><text x="219" y="353">60</text></g>
<g font-size="25" fill="var(--theme-74c8a8, #74c8a8)"><text x="32" y="185">2 · river</text><text x="205" y="185">900</text><text x="32" y="269">3 · leaf</text><text x="205" y="269">480</text></g>
<g stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M288 92L328 159"/><path d="M288 176H328"/><path d="M288 260H328"/><path d="M288 344L328 277"/></g>
<text x="360" y="140" font-size="22" fill="var(--theme-65b9dd, #65b9dd)">read_count &gt;= 400</text>
<g font-size="26" font-weight="600" fill="var(--theme-74c8a8, #74c8a8)"><text x="376" y="215">2 · river</text><text x="376" y="271">3 · leaf</text></g>
<path d="M14 401H626" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/>
<g font-size="26" font-weight="600"><text x="25" y="442" fill="var(--theme-65b9dd, #65b9dd)">4 rows delivered</text><text x="356" y="442" fill="var(--theme-74c8a8, #74c8a8)">2 rows returned</text></g>
</g></svg>
