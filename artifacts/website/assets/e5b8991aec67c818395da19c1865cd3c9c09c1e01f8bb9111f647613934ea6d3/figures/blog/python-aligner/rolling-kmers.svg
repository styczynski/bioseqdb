<svg xmlns="http://www.w3.org/2000/svg" width="610" height="631" viewBox="0 0 610 631" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-20364a:#ccd9e4;--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;}}</style>
<title id="title">A rolling two-bit k-mer key</title><desc id="desc">Teaching code A0,C1,G2,T3. ACG at start position0 has bits00 01 10, integer6. Shift6 left two bits, append T code3 and mask with six one bits63; the retained CGT at start position1 is01 10 11, integer27. Since the outgoing A has codezero, the mask changes no one bits in this particular step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Arial, sans-serif" fill="var(--theme-eef4f9, #eef4f9)"><text x="24" y="43" font-size="29" font-weight="bold">Roll the key, keep the last k bases</text><text x="24" y="84" font-size="23" fill="var(--theme-a9bccb, #a9bccb)">k = 3 · A=0, C=1, G=2, T=3</text><rect x="24" y="121" width="562" height="105" rx="14" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><text x="43" y="154" font-size="23" font-weight="bold">ACG</text><text x="557" y="154" text-anchor="end" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">start 0</text><text x="43" y="200" font-family="monospace" font-size="31" fill="var(--theme-65b9dd, #65b9dd)">00 01 10</text><text x="557" y="200" text-anchor="end" font-size="25" fill="var(--theme-74c8a8, #74c8a8)">= 6</text><path d="M305 229 V244" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="252" width="562" height="105" rx="14" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><text x="43" y="285" font-size="23" font-weight="bold">Shift left, append T</text><text x="557" y="285" text-anchor="end" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">T = 11</text><text x="43" y="331" font-family="monospace" font-size="31" fill="var(--theme-65b9dd, #65b9dd)">00 01 10 11</text><text x="557" y="331" text-anchor="end" font-size="25" fill="var(--theme-74c8a8, #74c8a8)">= 27</text><path d="M305 360 V375" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="383" width="562" height="105" rx="14" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><text x="43" y="416" font-size="23" font-weight="bold">Mask to six bits</text><text x="557" y="416" text-anchor="end" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">CGT · start 1</text><text x="43" y="462" font-family="monospace" font-size="31" fill="var(--theme-65b9dd, #65b9dd)">01 10 11</text><text x="557" y="462" text-anchor="end" font-size="25" fill="var(--theme-74c8a8, #74c8a8)">= 27</text><text x="24" y="558" font-family="monospace" font-size="23" fill="var(--theme-a9bccb, #a9bccb)">((6 &lt;&lt; 2) | 3) &amp; 63 = 27</text><text x="24" y="600" font-size="22" fill="var(--theme-a9bccb, #a9bccb)">With fixed k, leading zero bits are unambiguous.</text></g></svg>