</text>
<path d="M314,285 L590,285" fill="none" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="3"/>
<text x="450" y="323" fill="var(--theme-65b9dd, #65b9dd)" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle">
<tspan x="450" dy="0">[3, 6] inclusive → [2, 6) half-open</tspan>
</text>
<rect x="30" y="355" width="800" height="78" rx="12" fill="var(--theme-0a1826, #0a1826)" opacity="1" stroke="var(--theme-20364a, #20364a)" stroke-width="1.5"/>
<text x="50" y="385" fill="var(--theme-eef4f9, #eef4f9)" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">chromosome position = imported interval start + local position</tspan>
</text>
<text x="50" y="415" fill="var(--theme-a9bccb, #a9bccb)" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">Length = end − start. The base at end is not included.</tspan>
</text>
<text x="30" y="465" fill="var(--theme-a9bccb, #a9bccb)" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">
<tspan x="30" dy="0">The numbers above are a coordinate example, not positions of the optix gene.</tspan>
</text></svg>
