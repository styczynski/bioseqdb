<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-20364a:#ccd9e4;--theme-65b9dd:#146c91;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;}}</style>
<title id="title">Keep one coordinate convention</title><desc id="desc">An illustrative annotation covering positions three through six in one-based inclusive notation becomes the zero-based half-open interval [2, 6). An imported subinterval has its own origin that must be retained.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M0,0 L11,6 L0,12" fill="var(--theme-a9bccb, #a9bccb)"/></marker></defs>
<text x="30" y="43" fill="var(--theme-eef4f9, #eef4f9)" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start">
<tspan x="30" dy="0">Keep one coordinate convention</tspan>
</text>
<text x="30" y="92" fill="var(--theme-a9bccb, #a9bccb)" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">
<tspan x="30" dy="0">Same four bases, two ways to write their interval</tspan>
</text>
