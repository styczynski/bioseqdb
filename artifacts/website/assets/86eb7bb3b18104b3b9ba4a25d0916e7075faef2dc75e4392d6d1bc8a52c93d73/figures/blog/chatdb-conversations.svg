<svg xmlns="http://www.w3.org/2000/svg" width="640" height="614" viewBox="0 0 640 614" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-20364a:#ccd9e4;--theme-65b9dd:#146c91;--theme-74c8a8:#167251;--theme-a9bccb:#405c72;--theme-c9a8ff:#735091;--theme-eef4f9:#173247;--theme-f4894f:#b44d1c;}}</style>
<title id="title">ChatDB's two conversations</title>
  <desc id="desc">Normal operations go concurrently from a Python wrapper to the key-value conversation and the operation-log conversation. Undo trims the log, resets storage on the default initialization path, and replays retained commands without logging them again.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2">
      <rect x="14" y="12" width="612" height="96" rx="18"/>
      <rect x="14" y="178" width="292" height="160" rx="18"/>
      <rect x="334" y="178" width="292" height="160" rx="18"/>
      <rect x="14" y="402" width="612" height="198" rx="18"/>
    </g>
    <g fill="none" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 320 110 V 139 H 160 V 168"/>
      <path d="M 320 139 H 480 V 168"/>
    </g>
    <g font-size="27" font-weight="600" fill="var(--theme-eef4f9, #eef4f9)" text-anchor="middle">
      <text x="320" y="51">Python key-value wrapper</text>
      <text x="160" y="219">Store</text>
      <text x="480" y="219">Operation log</text>
    </g>
    <g font-size="22" fill="var(--theme-a9bccb, #a9bccb)" text-anchor="middle">
      <text x="320" y="86">One command → two concurrent requests</text>
      <text x="160" y="254">Conversation A</text>
      <text x="480" y="254">Conversation B</text>
    </g>
    <g font-size="21" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
      <g fill="var(--theme-f4894f, #f4894f)"><rect x="32" y="271" width="256" height="45" rx="8" fill-opacity=".12"/><text x="160" y="300">save / read / query</text></g>
      <g fill="var(--theme-74c8a8, #74c8a8)"><rect x="352" y="271" width="256" height="45" rx="8" fill-opacity=".12"/><text x="480" y="300">append / SHOW / UNDO</text></g>
    </g>
    <text x="320" y="374" font-size="22" fill="var(--theme-a9bccb, #a9bccb)" text-anchor="middle">Reads are logged too · no atomic commit</text>
    <text x="38" y="442" font-size="27" font-weight="600" fill="var(--theme-eef4f9, #eef4f9)">Undo on the default initialization path</text>
    <g fill="var(--theme-c9a8ff, #c9a8ff)" font-size="22" font-weight="600"><text x="38" y="483">1</text><text x="38" y="522">2</text><text x="38" y="561">3</text></g>
    <g fill="var(--theme-a9bccb, #a9bccb)" font-size="22"><text x="70" y="483">Trim the log by a number of commands</text><text x="70" y="522">Reset the storage conversation</text><text x="70" y="561">Replay retained commands without logging</text></g>
  </g>
</svg>
