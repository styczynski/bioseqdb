<svg xmlns="http://www.w3.org/2000/svg" width="610" height="780" viewBox="0 0 610 780" role="img" aria-labelledby="title desc">
<style id="bioseq-light-palette">@media(prefers-color-scheme:light){:root{--theme-0a1826:#ffffff;--theme-20364a:#ccd9e4;--theme-65b9dd:#146c91;--theme-a9bccb:#405c72;--theme-eef4f9:#173247;}}</style>
<title id="title">The Python prototype mapping pipeline</title><desc id="desc">Six stages: index reference chunks, sketch the read, build anchors from shared minimizer keys, shortlist candidate regions with the heuristic LIS and gap scoring, refine the ends with BWT and sometimes dynamic programming, and report a selected coordinate interval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="var(--theme-65b9dd, #65b9dd)"/></marker></defs>
<g font-family="Arial, sans-serif" fill="var(--theme-eef4f9, #eef4f9)"><text x="24" y="43" font-size="29" font-weight="bold">The prototype, one read at a time</text><rect x="24" y="76" width="562" height="92" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><circle cx="61" cy="110" r="18" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".15"/><text x="61" y="118" text-anchor="middle" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">1</text><text x="99" y="113" font-size="25" font-weight="bold">Index the reference</text><text x="45" y="148" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Process chunks and collect minimizer positions.</text><path d="M305 170 V185" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="192" width="562" height="92" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><circle cx="61" cy="226" r="18" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".15"/><text x="61" y="234" text-anchor="middle" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">2</text><text x="99" y="229" font-size="25" font-weight="bold">Sketch the read</text><text x="45" y="264" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Look up the same seed keys in the reference.</text><path d="M305 286 V301" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="308" width="562" height="92" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><circle cx="61" cy="342" r="18" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".15"/><text x="61" y="350" text-anchor="middle" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">3</text><text x="99" y="345" font-size="25" font-weight="bold">Build anchors</text><text x="45" y="380" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Pair reference and read positions for each key.</text><path d="M305 402 V417" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="424" width="562" height="92" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><circle cx="61" cy="458" r="18" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".15"/><text x="61" y="466" text-anchor="middle" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">4</text><text x="99" y="461" font-size="25" font-weight="bold">Find candidate regions</text><text x="45" y="496" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Heuristic LIS, gap scores, a short candidate list.</text><path d="M305 518 V533" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="540" width="562" height="92" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><circle cx="61" cy="574" r="18" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".15"/><text x="61" y="582" text-anchor="middle" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">5</text><text x="99" y="577" font-size="25" font-weight="bold">Refine the two ends</text><text x="45" y="612" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Try short BWT searches; use DP when needed.</text><path d="M305 634 V649" stroke="var(--theme-65b9dd, #65b9dd)" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="656" width="562" height="92" rx="15" fill="var(--theme-0a1826, #0a1826)" stroke="var(--theme-20364a, #20364a)" stroke-width="2"/><circle cx="61" cy="690" r="18" fill="var(--theme-65b9dd, #65b9dd)" fill-opacity=".15"/><text x="61" y="698" text-anchor="middle" font-size="23" fill="var(--theme-65b9dd, #65b9dd)">6</text><text x="99" y="693" font-size="25" font-weight="bold">Report coordinates</text><text x="45" y="728" font-size="21" fill="var(--theme-a9bccb, #a9bccb)">Return the selected interval, not a CIGAR string.</text></g></svg>