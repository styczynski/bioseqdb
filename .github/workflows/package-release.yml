name: Native package release

"on":
  push:
    branches:
      - main
      # Expensive validation runs on this branch require the exact marker in
      # the head commit message; ordinary refactor pushes only record a
      # skipped workflow run.
      - refactor/start-massive-refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Both refs reuse the same two native builders, so serialize them globally.
  # A release already being uploaded must never be cancelled by a newer push.
  group: bioseq-native-package-release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  PYTHONUNBUFFERED: "1"

jobs:
  package-release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/refactor/start-massive-refactor' &&
       contains(github.event.head_commit.message, '[package-release]')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/refactor/start-massive-refactor'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify release source identity and matrix
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 infra/package_builder.py matrix --require-complete \
            > "$RUNNER_TEMP/package-matrix.json"
          package_version=$(jq -r .package_version "$RUNNER_TEMP/package-matrix.json")
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          short_sha=${GITHUB_SHA:0:12}
          case "$GITHUB_REF" in
            refs/heads/main)
              release_prerelease=false
              release_title="Bioseq native packages ${package_version} (${short_sha})"
              ;;
            refs/heads/refactor/start-massive-refactor)
              release_prerelease=true
              release_title="Bioseq native packages ${package_version} (${short_sha}) [refactor validation]"
              ;;
            *)
              printf 'unsupported package release ref: %s\n' "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          printf 'PACKAGE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"
          printf 'RELEASE_PRERELEASE=%s\n' "$release_prerelease" >> "$GITHUB_ENV"
          printf 'RELEASE_TITLE=%s\n' "$release_title" >> "$GITHUB_ENV"

      - name: Reuse an already published exact-commit release
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          short_sha=${GITHUB_SHA:0:12}
          tag="bioseq-packages-v${PACKAGE_VERSION}-${short_sha}"
          tag_target=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [[ -n "$tag_target" ]]; then
            test "$tag_target" = "$GITHUB_SHA"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          test "$tag_target" = "$GITHUB_SHA"
          IFS=$'\t' read -r draft prerelease release_title < <(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,name \
              --jq '[.isDraft, .isPrerelease, .name] | @tsv'
          )
          test "$prerelease" = "$RELEASE_PRERELEASE"
          test "$release_title" = "$RELEASE_TITLE"
          if [[ "$draft" = true ]]; then
            exit 0
          fi

          published_assets="$RUNNER_TEMP/published-release-assets"
          mkdir -m 0700 "$published_assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$published_assets"
          python3 infra/package_builder.py verify-release-assets \
            --asset-dir "$published_assets" \
            --expected-revision "$GITHUB_SHA"
          for asset in "$published_assets"/*; do
            printf '%s\tsha256:%s\n' \
              "$(basename "$asset")" \
              "$(sha256sum "$asset" | cut -d ' ' -f 1)"
          done | LC_ALL=C sort > "$RUNNER_TEMP/published-local-digests.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq '.assets[] | [.name, .digest] | @tsv' \
            | LC_ALL=C sort > "$RUNNER_TEMP/published-api-digests.txt"
          diff -u \
            "$RUNNER_TEMP/published-local-digests.txt" \
            "$RUNNER_TEMP/published-api-digests.txt"
          printf 'RELEASE_ALREADY_COMPLETE=1\n' >> "$GITHUB_ENV"

      - name: Create ephemeral builder access
        if: env.RELEASE_ALREADY_COMPLETE != '1'
        timeout-minutes: 10
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          ssh-keygen -q -t ed25519 -N '' \
            -f "$RUNNER_TEMP/package-builder-key"
          python3 infra/package_builder.py open-ci-access \
            --region "$AWS_REGION" \
            --ssh-key "$RUNNER_TEMP/package-builder-key" \
            --owner-token "$GITHUB_REPOSITORY:$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/package-builder-access.json"

      - name: Build and collect the complete package matrix
        if: env.RELEASE_ALREADY_COMPLETE != '1'
        timeout-minutes: 270
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          python3 infra/package_builder.py run \
            --existing-only \
            --optimization O3 \
            --ssh-key "$RUNNER_TEMP/package-builder-key" \
            --lifecycle-receipt "$RUNNER_TEMP/package-builder-access.json" \
            --region "$AWS_REGION"
          python3 infra/package_builder.py collect \
            --region "$AWS_REGION" \
            --run-result infra/package_build_infra/.runtime/last-run.json \
            --output-dir "$RUNNER_TEMP/release-assets" \
            --expected-revision "$GITHUB_SHA"

      - name: Preserve verified packages and receipts
        if: env.RELEASE_ALREADY_COMPLETE != '1'
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bioseq-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Revoke access and stop only quiescent owned builders before publishing
        if: env.RELEASE_ALREADY_COMPLETE != '1'
        timeout-minutes: 15
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          cleanup_status=0
          python3 infra/package_builder.py close-ci-access \
            --region "$AWS_REGION" \
            --receipt "$RUNNER_TEMP/package-builder-access.json" \
            || cleanup_status=$?
          python3 infra/package_builder.py stop \
            --region "$AWS_REGION" \
            --lifecycle-receipt "$RUNNER_TEMP/package-builder-access.json" \
            || cleanup_status=$?
          if [[ $cleanup_status -eq 0 ]]; then
            printf 'PACKAGE_BUILDERS_CLEANED=1\n' >> "$GITHUB_ENV"
          fi
          exit "$cleanup_status"

      - name: Create deterministic GitHub release
        if: env.RELEASE_ALREADY_COMPLETE != '1'
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          short_sha=${GITHUB_SHA:0:12}
          tag="bioseq-packages-v${PACKAGE_VERSION}-${short_sha}"
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_PRERELEASE" = true ]]; then
            printf '%s\n' \
              "Validation prerelease for refactor/start-massive-refactor." \
              "Native PostgreSQL 17 packages for the repository-declared distro and architecture matrix." \
              "Tag convention: bioseq-packages-v<package-version>-<12-character-source-SHA>." \
              "Source commit: ${GITHUB_SHA}" > "$notes"
          else
            test "$RELEASE_PRERELEASE" = false
            printf '%s\n' \
              "Native PostgreSQL 17 packages for the repository-declared distro and architecture matrix." \
              "Tag convention: bioseq-packages-v<package-version>-<12-character-source-SHA>." \
              "Source commit: ${GITHUB_SHA}" > "$notes"
          fi
          python3 infra/package_builder.py verify-release-assets \
            --asset-dir "$RUNNER_TEMP/release-assets" \
            --expected-revision "$GITHUB_SHA"

          verify_assets() {
            local expected_assets="$RUNNER_TEMP/expected-assets.txt"
            local observed_assets="$RUNNER_TEMP/observed-assets.txt"
            for asset in "$RUNNER_TEMP"/release-assets/*; do
              printf '%s\tsha256:%s\n' \
                "$(basename "$asset")" \
                "$(sha256sum "$asset" | cut -d ' ' -f 1)"
            done | LC_ALL=C sort > "$expected_assets"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --jq '.assets[] | [.name, .digest] | @tsv' \
              | LC_ALL=C sort > "$observed_assets"
            diff -u "$expected_assets" "$observed_assets"
          }

          tag_target=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [[ -n "$tag_target" ]]; then
            test "$tag_target" = "$GITHUB_SHA"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$tag_target" = "$GITHUB_SHA"
            IFS=$'\t' read -r draft prerelease release_title < <(
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease,name \
                --jq '[.isDraft, .isPrerelease, .name] | @tsv'
            )
            test "$prerelease" = "$RELEASE_PRERELEASE"
            test "$release_title" = "$RELEASE_TITLE"
            if [[ "$draft" = false ]]; then
              verify_assets
              exit 0
            fi
          else
            release_flags=(--draft)
            if [[ "$RELEASE_PRERELEASE" = true ]]; then
              release_flags+=(--prerelease)
            else
              test "$RELEASE_PRERELEASE" = false
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes" \
              "${release_flags[@]}"
          fi

          # Converge a retryable draft to the exact local asset set. Deletion is
          # guarded by both the exact tag target and draft state; the complete
          # replacement set was verified above and the release remains a draft
          # until the post-upload count and digest checks pass.
          tag_target=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          test "$tag_target" = "$GITHUB_SHA"
          IFS=$'\t' read -r draft prerelease release_title < <(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,name \
              --jq '[.isDraft, .isPrerelease, .name] | @tsv'
          )
          test "$draft" = true
          test "$prerelease" = "$RELEASE_PRERELEASE"
          test "$release_title" = "$RELEASE_TITLE"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq 'select(.draft == true) | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq '.[].id' > "$RUNNER_TEMP/stale-draft-asset-ids.txt"
          while IFS= read -r asset_id; do
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10"
          done < "$RUNNER_TEMP/stale-draft-asset-ids.txt"

          gh release upload "$tag" "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          expected=$(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f | wc -l | tr -d ' ')
          observed=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          test "$observed" = "$expected"
          verify_assets
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          IFS=$'\t' read -r draft prerelease release_title < <(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,name \
              --jq '[.isDraft, .isPrerelease, .name] | @tsv'
          )
          test "$draft" = false
          test "$prerelease" = "$RELEASE_PRERELEASE"
          test "$release_title" = "$RELEASE_TITLE"
          verify_assets

      - name: Revoke access and stop only quiescent owned builders (always)
        if: always()
        timeout-minutes: 25
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ ${PACKAGE_BUILDERS_CLEANED:-} == 1 ]]; then
            exit 0
          fi
          if [[ ! -f "$RUNNER_TEMP/package-builder-access.json" ]]; then
            exit 0
          fi
          cleanup_status=0
          python3 infra/package_builder.py close-ci-access \
            --region "$AWS_REGION" \
            --receipt "$RUNNER_TEMP/package-builder-access.json" \
            || cleanup_status=$?
          python3 infra/package_builder.py stop \
            --region "$AWS_REGION" \
            --lifecycle-receipt "$RUNNER_TEMP/package-builder-access.json" \
            || cleanup_status=$?
          exit "$cleanup_status"
